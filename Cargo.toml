[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dmitryweiner/voice-modem"

[workspace.dependencies]
modem-core = { path = "crates/modem-core" }
modem-sim = { path = "crates/modem-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Signal processing in tests is too slow unoptimised.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
